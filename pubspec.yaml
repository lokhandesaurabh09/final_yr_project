name: flutter_application_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

  cupertino_icons: ^1.0.8

  # Camera & image picking
  camera: ^0.10.5+9
  image_picker: ^1.0.7

  # ML model
  tflite_flutter: ^0.10.4

  # Local database for scan history
  sqflite: ^2.3.2
  path: ^1.9.0
  path_provider: ^2.1.2

  # State management
  provider: ^6.1.2

  # Networking
  http: ^1.2.1

  # Preferences
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  #assets:
   # - assets/images/

# 1) In the terminal:   flutter pub add dev:flutter_launcher_icons
# 2) Add this block at the END of pubspec.yaml (top level, not indented):

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#173D2A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true

# 3) Then run:   dart run flutter_launcher_icons
